<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <meta name="theme-color" content="#0b0b0b" />

    <!-- Link previews. These live in the shell on purpose: social crawlers do
         not run JavaScript, so anything rendered by React is invisible to them.
         This block is the safety net when prerendering fails.
         Deliberately NOT here: title, meta description, canonical and og:url.
         Pages own those; a static copy here would emit duplicates and win. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FrameStudio" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:title" content="FrameStudio — Digital Solutions for Kenyan Businesses" />
    <meta property="og:description" content="Websites, WhatsApp bots, and business dashboards for Kenyan SMEs. M-Pesa integration, real-time inventory, automated customer replies." />
    <meta property="og:image" content="https://www.framestudio.co.ke/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FrameStudio — websites, bots and dashboards for Kenyan businesses" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FrameStudio — Digital Solutions for Kenyan Businesses" />
    <meta name="twitter:description" content="Websites, WhatsApp bots, and business dashboards for Kenyan SMEs." />
    <meta name="twitter:image" content="https://www.framestudio.co.ke/og-image.png" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- General Sans — body voice: smooth, geometric, quietly friendly -->
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
    <!-- Bricolage Grotesque — display voice: quirky, soft-cornered; Instrument Serif — editorial italic accent; Space Mono — labels, stats, tags -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
