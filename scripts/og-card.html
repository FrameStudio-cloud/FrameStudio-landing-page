<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      /* 1200 x 630 Open Graph card. Keep every word inside 72px of padding:
         WhatsApp and LinkedIn crop toward the edges on some clients. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #0b0b0b;
        color: #fbf8f0;
        font-family: 'General Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
        position: relative;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 80% at 12% 0%, #1a0e0a 0%, rgba(11, 11, 11, 0) 62%),
          radial-gradient(40% 55% at 96% 92%, rgba(255, 90, 54, 0.16) 0%, rgba(11, 11, 11, 0) 70%);
      }
      .top, .bottom { position: relative; display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 54px; height: 54px; color: #ff5a36; }
      .brand .name {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .brand .name span { color: rgba(251, 248, 240, 0.45); }
      .eyebrow {
        font-family: 'Space Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #ff5a36;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .eyebrow i { width: 8px; height: 8px; border-radius: 999px; background: #ff5a36; display: inline-block; }
      .middle { position: relative; padding-bottom: 4px; }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-weight: 600;
        font-size: 82px;
        line-height: 0.94;
        letter-spacing: -0.035em;
        max-width: 1000px;
      }
      h1 em {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        color: #ff5a36;
        font-size: 1.04em;
      }
      .sub {
        margin-top: 26px;
        font-size: 25px;
        line-height: 1.45;
        color: rgba(251, 248, 240, 0.58);
        max-width: 860px;
      }
      .bottom .tags {
        font-family: 'Space Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(251, 248, 240, 0.55);
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .bottom .tags b { color: #ff5a36; font-weight: 400; }
      .bottom .url {
        font-family: 'Space Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
        color: rgba(251, 248, 240, 0.4);
      }
      .rule { position: absolute; left: 72px; right: 72px; bottom: 132px; height: 1px; background: rgba(251, 248, 240, 0.12); }
    </style>
  </head>
  <body>
    <div class="glow"></div>

    <div class="top">
      <div class="brand">
        <svg viewBox="250 140 750 1050" aria-hidden="true">
          <polygon points="770,500 983,398 987,959 770,850" fill="currentColor" />
          <polygon points="269,421 907,157 909,332 443,523 445,1011 760,899 933,985 479,1168 269,1060" fill="currentColor" />
        </svg>
        <div class="name">Frame<span>Studio</span></div>
      </div>
      <div class="eyebrow"><i></i> Nairobi, Kenya</div>
    </div>

    <div class="middle">
      <h1>Digital tools for <em>growing</em> Kenyan businesses</h1>
      <p class="sub">Websites, WhatsApp bots and business dashboards — built for how Kenyan SMEs actually sell.</p>
    </div>

    <div class="rule"></div>

    <div class="bottom">
      <div class="tags">
        Websites <b>·</b> Bots <b>·</b> Dashboards
      </div>
      <div class="url">framestudio.co.ke</div>
    </div>
  </body>
</html>
